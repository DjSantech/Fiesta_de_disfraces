# Avisa a Render que redespliegue el backend cuando cambia backend/ en main.
# Requiere el secreto RENDER_DEPLOY_HOOK_URL (Render > servicio > Settings > Deploy Hook).
# Si el secreto no existe, el trabajo termina sin hacer nada.
name: Deploy backend (Render)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'render.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Disparar deploy en Render
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Sin RENDER_DEPLOY_HOOK_URL: no se dispara el deploy."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Deploy solicitado a Render."
