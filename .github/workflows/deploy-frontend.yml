# Publica el frontend en Cloudflare Pages cada vez que cambia frontend/ en main.
# Requiere los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID
# (GitHub > Settings > Secrets and variables > Actions).
name: Deploy frontend (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: fiestadedisfraces
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Compilar
        working-directory: frontend
        run: npm run build
        env:
          # URL pública del backend (Render). Se puede cambiar con la variable VITE_API_URL del repo.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://fiesta-disfraces-api.onrender.com' }}

      - name: Crear el proyecto en Cloudflare Pages (solo la primera vez)
        run: npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main || echo "El proyecto ya existe"

      - name: Publicar
        run: npx --yes wrangler@4 pages deploy frontend/dist --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true
